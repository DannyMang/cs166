<!DOCTYPE html>
<html>
<head>
  <title>Phishing Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Phishing Shield</h1>
    <div id="status">
      <div class="status-indicator safe">Protected</div>
    </div>
    <div id="stats">
      <p>Threats blocked: <span id="threats-blocked">0</span></p>
      <p>Sites scanned: <span id="sites-scanned">0</span></p>
    </div>
    <div id="settings">
      <h2>Settings</h2>
      <label>
        <input type="checkbox" id="enable-protection" checked>
        Enable protection
      </label>
      <label>
        <input type="checkbox" id="show-warnings" checked>
        Show warnings
      </label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
